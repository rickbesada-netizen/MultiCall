name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent signing key
        env:
          SIGNING_KEY: ${{ secrets.MULTICALL_SIGNING_KEY }}
        run: |
          mkdir -p ~/.android
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > ~/.android/debug.keystore
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: multicall-signing-key-v1
      - run: gradle assembleDebug --stacktrace
      - run: echo "$GITHUB_RUN_NUMBER" > version.txt
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - run: cp app/build/outputs/apk/debug/app-debug.apk MultiCall.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MultiCall-APK
          path: MultiCall.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --target "$GITHUB_SHA" --title "MultiCall Android" --notes "Experimental Android audio utility." --latest
          gh release upload android-latest MultiCall.apk version.txt --clobber
